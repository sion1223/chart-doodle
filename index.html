<title>차트 낙서 점술관 · Chart Doodle Oracle</title>

<style>
/* Layout: a sober trading-terminal shell; the only loud thing is the crayon layer on the chart. */
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --fg:#121821; --muted:#5A6576; --line:#D6DCE4; --soft:#F6F8FB;
  --ink:#6A2BE8; --on-ink:#FFFFFF; --hl:rgba(255,222,64,.55); --future:rgba(106,43,232,.05);
  --up-ko:#E0303A; --down-ko:#2563EB; --up-en:#12996A; --down-en:#E0303A;
  --font-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-doodle:"Gaegu","Comic Sans MS","Malgun Gothic",cursive;
  --font-num:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C1016; --panel:#141A22; --fg:#E5EAF1; --muted:#8B97A9; --line:#232C38; --soft:#10151C;
  --ink:#B794FF; --on-ink:#0C1016; --hl:rgba(255,214,10,.28); --future:rgba(183,148,255,.06);
  --up-ko:#FF5560; --down-ko:#4D8BFF; --up-en:#2FCB8E; --down-en:#FF5560; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand h1{margin:0;font:700 34px/1 var(--font-doodle);color:var(--ink);transform:rotate(-1.5deg);letter-spacing:-.5px}
.brand p{margin:0;color:var(--muted);font-size:13.5px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;color:var(--muted);font:500 13px var(--font-ui);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.search{position:relative;display:grid;gap:10px}
.search input{width:100%;font:16px var(--font-ui);padding:13px 14px 13px 40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);outline:none}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 18%,transparent)}
.search .ic{position:absolute;left:14px;top:14px;width:16px;height:16px;color:var(--muted);pointer-events:none}
.tabs,.chips,.periods,.chars{display:flex;gap:6px;flex-wrap:wrap}
.tab,.chip,.per,.charbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--font-ui);padding:5px 11px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"],.per[aria-pressed="true"],.charbtn[aria-pressed="true"]{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.chip{background:transparent;color:var(--muted)}
.chip:hover,.tab:hover,.per:hover,.charbtn:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.results{position:absolute;z-index:20;top:50px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:360px;overflow:auto;padding:4px}
.res{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 10px;border-radius:7px;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--soft)}
.res b{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res small{color:var(--muted);font-size:12px;grid-column:1}
.res .badge{grid-row:1/3;grid-column:2;align-self:center;font:500 11px var(--font-num);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 6px}
.res.empty{display:block;color:var(--muted);cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ttl{min-width:0}
.ttl h2{margin:0;font-size:20px;line-height:1.25}
.ttl .sub{color:var(--muted);font:500 12.5px var(--font-num)}
.px{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.px .p{font-size:20px}
.px .c{font-size:13px}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 16px}
.cv{position:relative;padding:0 6px}
canvas{display:block;width:100%;touch-action:pan-y}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;padding:16px;border-top:1px solid var(--line);align-items:start}
.vtext{min-width:0}
.vbig{font:700 40px/1 var(--font-doodle);display:inline-block;padding:0 6px;background:linear-gradient(transparent 45%,var(--hl) 45%,var(--hl) 88%,transparent 88%);transform:rotate(-2deg)}
.vmeta{margin:8px 0 4px;font:500 13px var(--font-num);color:var(--muted)}
.vreason{margin:0;font:400 21px/1.35 var(--font-doodle);max-width:62ch;text-wrap:pretty}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 14px var(--font-ui);padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn:hover{filter:brightness(1.05)}
.charsrow{padding:0 16px 16px;display:grid;gap:8px}
.charsrow .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
footer{color:var(--muted);font-size:12.5px;display:grid;gap:4px}
footer strong{color:var(--fg);font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.loading{padding:60px 16px;text-align:center;color:var(--muted);font:22px var(--font-doodle)}
@media (max-width:620px){
  .brand h1{font-size:28px}
  .verdict{grid-template-columns:1fr}
  .actions{justify-content:flex-start}
  .vbig{font-size:34px}
  .vreason{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      </div>
      <div class="charsrow">

        <div class="chars" id="chars" role="group"></div>

    </div>
  </section>

  <footer>

    <div id="t-src"></div>
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

/* ---------- search ---------- */
let sel = 0, shown = [];
function norm(s) { return s.toLowerCase().replace(/[\s().\-/&]/g, ""); }
function showResults(open) {
  const q = norm($("q").value);
  const box = $("results");
  if (!open && !q) { box.hidden = true; return; }
  let list = ITEMS.filter((it) => tab === "all" || it.cat === tab);
  if (q) {
    list = list.map((it) => {
      const keys = [it.ko, it.en, it.sym, it.sym.replace("/USDT", "")].map(norm);
      let s = -1;
      for (const k of keys) { if (k === q) s = Math.max(s, 3); else if (k.startsWith(q)) s = Math.max(s, 2); else if (k.includes(q)) s = Math.max(s, 1); }
      return [s, it];
    }).filter((x) => x[0] >= 0).sort((a, b) => b[0] - a[0]).map((x) => x[1]);
  }
  shown = list.slice(0, 40); sel = 0;
  const raw = $("q").value.trim().toUpperCase();
  if (LIVE_API && (/^\d{6}$/.test(raw) || /^[A-Z]{1,5}$/.test(raw)) && !ITEMS.some((it) => it.sym === raw) && tab !== "coin") {
    const kr = /^\d{6}$/.test(raw);
    shown.push({ id: (kr ? "kr-" : "us-") + raw, sym: raw, ko: raw, en: raw, cat: kr ? "kr" : "us", cur: kr ? "KRW" : "USD", d: null, direct: true });
  }
  box.innerHTML = "";
  if (!shown.length) { const d = document.createElement("div"); d.className = "res empty"; d.textContent = T[LANG].noRes; box.appendChild(d); }
  shown.forEach((it, i) => {
    const d = document.createElement("div"); d.className = "res"; d.setAttribute("role", "option"); d.setAttribute("aria-selected", i === sel);
    const b = document.createElement("b"); b.textContent = it.direct ? T[LANG].direct(it.sym) : name(it);
    const s = document.createElement("small"); s.textContent = it.direct ? T[LANG].directSub : `${LANG === "ko" ? it.en : it.ko} · ${it.sym}`;
    const g = document.createElement("span"); g.className = "badge"; g.textContent = T[LANG].cat[it.cat];
    d.append(b, g, s);
    d.onmousedown = (e) => { e.preventDefault(); select(it); };
    box.appendChild(d);
  });
  box.hidden = false;
}
function moveSel(dx) {
  if (!shown.length) return;
  sel = (sel + dx + shown.length) % shown.length;
  [...$("results").children].forEach((c, i) => c.setAttribute("aria-selected", i === sel));
  $("results").children[sel].scrollIntoView({ block: "nearest" });
}
$("q").addEventListener("input", () => showResults(true));
$("q").addEventListener("focus", () => showResults(true));
$("q").addEventListener("blur", () => setTimeout(() => ($("results").hidden = true), 120));
$("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); moveSel(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); moveSel(-1); }
  else if (e.key === "Enter") { e.preventDefault(); if (shown[sel]) select(shown[sel]); }
  else if (e.key === "Escape") { $("results").hidden = true; $("q").blur(); }
});

async function select(it) {
  if (!it.d) {
    $("results").hidden = true;
    await refreshLive(it);
    if (!it.d) { toast(T[LANG].notFound); return; }
    if (!BYID[it.id]) { ITEMS.push(it); BYID[it.id] = it; }
  }
  cur = it; reroll = 0; forced = null;
  $("q").value = ""; $("results").hidden = true;
  try { history.replaceState(null, "", "#" + it.id); } catch (e) {}
  header(); draw(true);
  if (!live[it.id]) refreshLive(it);
  window.scrollTo({ top: $("card").offsetTop - 10, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
async function refreshLive(it) {
  try {
    let rows = null;
    if (it.cat === "coin") {
      const base = it.sym.replace("/USDT", "");
      const r = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${base}USDT&interval=1d&limit=260`);
      if (!r.ok) return;
      const js = await r.json();
      if (Array.isArray(js)) rows = js.map((k) => { const t = new Date(k[0]); const d = t.getUTCFullYear() * 10000 + (t.getUTCMonth() + 1) * 100 + t.getUTCDate(); return [d, +k[1], +k[2], +k[3], +k[4]]; });
    } else if (LIVE_API) {
      const r = await fetch(`${LIVE_API}?id=${encodeURIComponent(it.id)}`);
      if (!r.ok) return;
      const js = await r.json();
      rows = js && js.d;
      if (js && js.name && it.ko === it.sym) { it.ko = js.name; it.en = js.name; }
    }
    if (!Array.isArray(rows) || rows.length < 60) return;
    it.d = rows;
    live[it.id] = true;
    if (cur === it) { header(); draw(false); }
  } catch (e) { /* keep snapshot */ }
}

function header() {
  const it = cur, d = it.d, last = d[d.length - 1], prev = d[d.length - 2];
  $("nm").textContent = name(it);
  $("sb").textContent = `${it.sym} · ${T[LANG].cat[it.cat]} · ${LANG === "ko" ? it.en : it.ko}`;
  $("lp").textContent = fmtP(last[4], it.cur);
  const ch = (last[4] / prev[4] - 1) * 100;

  $("lc").textContent = `${up ? "+" : ""}${ch.toFixed(2)}%`;

/* ---------- geometry ---------- */
function catmull(P, seg = 12) {
  if (P.length < 3) return P.slice();
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let k = 0; k < seg; k++) {
      const t = k / seg, t2 = t * t, t3 = t2 * t;
      out.push({
        x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3),
      });
    }
  }
  out.push(P[P.length - 1]);
  return out;
}
function ellipsePts(cx, cy, rx, ry, rng, a0 = 0, a1 = Math.PI * 2.08) {
  const out = [], n = 36, wob = 0.06;
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * (i / n), k = 1 + (rng() - 0.5) * wob;
    out.push({ x: cx + Math.cos(a) * rx * k, y: cy + Math.sin(a) * ry * k });
  }
  return out;
}

/* Pen: collects strokes; rendered later with crayon wobble and stroke-order animation. */
function makePen(rng, s) {
  const items = [];
  return {
    items,
    line(P, o = {}) { if (P.length > 1) items.push({ k: "l", P, w: (o.w || 3.2) * s, dash: o.dash || null }); },
    curve(P, o) { this.line(catmull(P), o); },
    ell(cx, cy, rx, ry, o, a0, a1) { this.line(ellipsePts(cx, cy, rx, ry, rng, a0, a1), o); },
    dot(x, y, r = 3) { items.push({ k: "d", x, y, r: r * s }); },
    arrowHead(from, to, size) {
      const a = Math.atan2(to.y - from.y, to.x - from.x), L = size * s;
      this.line([{ x: to.x - L * Math.cos(a - 0.5), y: to.y - L * Math.sin(a - 0.5) }, to, { x: to.x - L * Math.cos(a + 0.5), y: to.y - L * Math.sin(a + 0.5) }], { w: 3.6 });
    },
    text(x, y, str, o = {}) { items.push({ k: "t", x, y, str, size: (o.size || 19) * s, rot: o.rot ?? (rng() - 0.5) * 0.12, align: o.align || "center", hl: !!o.hl }); },
    pointer(x, y, tx, ty, str) { // label with a scribbly arrow to (tx,ty)
      this.text(x, y, str);
      const fx = x + (tx - x) * 0.18, fy = y + (ty - y) * 0.18 + 6 * s;
      const ex = tx - (tx - x) * 0.12, ey = ty - (ty - y) * 0.12;
      const mx = (fx + ex) / 2 + (rng() - 0.5) * 12 * s, my = (fy + ey) / 2 + (rng() - 0.5) * 12 * s;
      const P = catmull([{ x: fx, y: fy }, { x: mx, y: my }, { x: ex, y: ey }], 8);
      this.line(P, { w: 2.2 }); this.arrowHead(P[P.length - 3], P[P.length - 1], 9);
    },
  };
}

/* ---------- chart analysis ---------- */
function analyze(rows, box) {
  const n = rows.length;
  let lo = Infinity, hi = -Infinity;
  for (const r of rows) { lo = Math.min(lo, r[3]); hi = Math.max(hi, r[2]); }
  const span = hi - lo || hi * 0.01 || 1;
  const pLo = lo - span * 0.42, pHi = hi + span * 0.42;
  const y = (p) => box.top + (1 - (p - pLo) / (pHi - pLo)) * (box.bottom - box.top);
  const y2p = (yy) => pLo + (1 - (yy - box.top) / (box.bottom - box.top)) * (pHi - pLo);
  const cw = box.histW / n, X = (i) => box.left + (i + 0.5) * cw;
  const k = Math.max(1, Math.round(n / 28));
  const pts = rows.map((_, i) => {
    let s = 0, c = 0;
    for (let j = Math.max(0, i - k); j <= Math.min(n - 1, i + k); j++) { s += rows[j][4]; c++; }
    return { x: X(i), y: y(s / c) };
  });
  pts[n - 1] = { x: X(n - 1), y: y(rows[n - 1][4]) }; // the doodle starts from the real last close
  const U = (box.bottom - box.top) * 0.1;
  const v = pts.map((p) => -p.y), vmin = Math.min(...v), vmax = Math.max(...v), th = (vmax - vmin) * 0.16;
  const piv = []; let mode = 0, hiI = 0, loI = 0;
  for (let i = 1; i < n; i++) {
    if (mode !== -1 && v[i] >= v[hiI]) hiI = i;
    if (mode !== 1 && v[i] <= v[loI]) loI = i;
    if (mode !== -1 && v[hiI] - v[i] > th) { piv.push({ i: hiI, t: "H" }); mode = -1; loI = i; }
    else if (mode !== 1 && v[i] - v[loI] > th) { piv.push({ i: loI, t: "L" }); mode = 1; hiI = i; }
  }
  if (mode === 1 && hiI > (piv.at(-1)?.i ?? -1)) piv.push({ i: hiI, t: "H", tent: 1 });
  if (mode === -1 && loI > (piv.at(-1)?.i ?? -1)) piv.push({ i: loI, t: "L", tent: 1 });
  const highs = piv.filter((p) => p.t === "H"), lows = piv.filter((p) => p.t === "L");
  const L = pts[n - 1];
  const idx = (f) => clamp(Math.round(f * (n - 1)), 0, n - 1);
  const rise = (pts[idx(0.8)].y - L.y) / U;
  const tail = pts.slice(idx(0.65));
  const flat = (Math.max(...tail.map((p) => p.y)) - Math.min(...tail.map((p) => p.y))) / ((vmax - vmin) || 1) < 0.28;
  const lastHigh = highs.at(-1) || null;
  const fallSince = lastHigh ? (L.y - pts[lastHigh.i].y) / U : 0;
  const fx0 = L.x, fw = box.right - fx0 - 8 * box.s;
  const cy = (yy) => clamp(yy, box.top + 14, box.bottom - 8);
  const F = (fx, du) => ({ x: fx0 + fx * fw, y: cy(L.y - du * U) });
  const minIn = (a, b) => { let m = idx(a); for (let i = idx(a); i <= idx(b); i++) if (pts[i].y < pts[m].y) m = i; return m; };
  const maxIn = (a, b) => { let m = idx(a); for (let i = idx(a); i <= idx(b); i++) if (pts[i].y > pts[m].y) m = i; return m; };
  return { n, rows, pts, U, piv, highs, lows, L, idx, rise, flat, lastHigh, fallSince, fx0, fw, F, cy, y, y2p, box, minIn, maxIn, X, cw, pLo, pHi };
}

/* ---------- characters ----------
   Each returns { target, reason } and draws with pen. The future part of the drawing is the "forecast". */
const CHARS = {
  cat: {
    score: (A) => 1 + (A.lastHigh && A.lastHigh.i > 0.5 * A.n ? 1 : 0) + (A.fallSince > 0.8 ? 0.5 : 0),
    build(A, pen, lb) {
      const hi = A.lastHigh && A.lastHigh.i > 0.45 * A.n ? A.lastHigh.i : A.minIn(0.5, 0.97);
      const e1 = A.pts[hi], L = A.L, U = A.U;
      const fallen = (L.y - e1.y) / U > 0.6;
      const ax = A.fx0 + 0.42 * A.fw, ay = A.cy(fallen ? e1.y : Math.min(e1.y, L.y) - 0.6 * U);
      const apex = { x: ax, y: ay };
      const path = fallen
        ? [L, { x: A.fx0 + 0.2 * A.fw, y: (L.y + ay) / 2 + 0.2 * U }, apex, { x: A.fx0 + 0.62 * A.fw, y: A.cy(ay + 1.3 * U) }]
        : [L, { x: A.fx0 + 0.18 * A.fw, y: A.cy(L.y + 0.9 * U) }, apex, { x: A.fx0 + 0.62 * A.fw, y: A.cy(ay + 1.3 * U) }];
      pen.curve(path, { w: 4 });
      const faceTop = Math.max(e1.y, ay) + 0.9 * U;
      let r = Math.max((ax - e1.x) * 0.62, 1.4 * U);
      let cx = (e1.x + ax) / 2, cyy = faceTop + r * 0.75;
      const maxB = A.box.bottom - 6;
      if (cyy + r > maxB) { r = Math.max(0.9 * U, (maxB - faceTop) / 1.75); cyy = faceTop + r * 0.75; }
      for (const e of [e1, apex]) pen.line([{ x: e.x - 0.5 * U, y: faceTop + 0.4 * U }, e, { x: e.x + 0.5 * U, y: faceTop + 0.4 * U }], { w: 3 });
      pen.ell(cx, cyy, r * 1.1, r, { w: 3.4 });
      pen.dot(cx - r * 0.38, cyy - r * 0.12, 4); pen.dot(cx + r * 0.38, cyy - r * 0.12, 4);
      pen.line([{ x: cx - r * 0.1, y: cyy + r * 0.1 }, { x: cx + r * 0.1, y: cyy + r * 0.1 }, { x: cx, y: cyy + r * 0.22 }, { x: cx - r * 0.1, y: cyy + r * 0.1 }], { w: 2.6 });
      pen.line([{ x: cx - r * 0.3, y: cyy + r * 0.3 }, { x: cx - r * 0.15, y: cyy + r * 0.44 }, { x: cx, y: cyy + r * 0.3 }, { x: cx + r * 0.15, y: cyy + r * 0.44 }, { x: cx + r * 0.3, y: cyy + r * 0.3 }], { w: 2.6 });
      for (const sgn of [-1, 1]) for (const dy of [-0.08, 0.12, 0.32]) pen.line([{ x: cx + sgn * r * 0.5, y: cyy + r * 0.2 }, { x: cx + sgn * r * 1.35, y: cyy + r * (0.2 + dy * 1.4) }], { w: 2 });
      pen.pointer(e1.x - 1.4 * U, e1.y - 1.3 * U, e1.x - 0.1 * U, e1.y - 0.2 * U, lb.ear1);
      pen.pointer(ax + 0.9 * U, ay - 1.4 * U, ax + 0.1 * U, ay - 0.2 * U, lb.ear2);
      return { target: apex, reason: "cat" };
    },
  },
  camel: {
    score: (A) => { const h = A.highs.filter((p) => p.i > 0.25 * A.n).length; return 0.8 + (h >= 2 ? 1.3 : h >= 1 ? 0.6 : 0); },
    build(A, pen, lb) {
      const U = A.U, L = A.L, hs = A.highs.filter((p) => p.i > 0.2 * A.n);
      let target, reason, legL, legR, humps;
      if (hs.length >= 2) {
        const h1 = A.pts[hs.at(-2).i], h2 = A.pts[hs.at(-1).i];
        const neckB = A.F(0.42, -1.8), head = A.F(0.72, -0.7);
        pen.curve([L, A.F(0.2, -0.8), neckB, A.F(0.6, -1.4), head], { w: 4 });
        pen.ell(head.x + 0.55 * U, head.y - 0.15 * U, 0.75 * U, 0.42 * U, { w: 3 });
        pen.dot(head.x + 0.6 * U, head.y - 0.3 * U, 3.4);
        pen.line([{ x: head.x + 0.1 * U, y: head.y - 0.45 * U }, { x: head.x + 0.2 * U, y: head.y - 0.85 * U }, { x: head.x + 0.35 * U, y: head.y - 0.5 * U }], { w: 2.4 });
        target = neckB; reason = "camel2"; humps = [[h1, lb.hump1], [h2, lb.hump2]];
        legL = h1.x - (h2.x - h1.x) * 0.45; legR = L.x + 0.2 * U;
        pen.pointer(head.x + 0.6 * U, head.y - 1.8 * U, head.x + 0.4 * U, head.y - 0.6 * U, lb.head);
      } else {
        const hi = hs.length ? hs.at(-1).i : A.minIn(0.3, 0.9);
        const h1 = A.pts[hi];
        const apex = { x: A.fx0 + 0.4 * A.fw, y: A.cy(Math.min(h1.y, L.y - 1.0 * U)) };
        const head = A.F(0.82, 0.2);
        pen.curve([L, { x: A.fx0 + 0.12 * A.fw, y: A.cy(L.y + 0.35 * U) }, apex, { x: A.fx0 + 0.66 * A.fw, y: A.cy(L.y + 0.3 * U) }, head], { w: 4 });
        pen.ell(head.x + 0.45 * U, head.y - 0.1 * U, 0.6 * U, 0.38 * U, { w: 3 });
        pen.dot(head.x + 0.55 * U, head.y - 0.22 * U, 3.4);
        target = apex; reason = "camel1"; humps = [[h1, lb.hump1], [apex, lb.hump2s]];
        legL = h1.x - 1.2 * U; legR = apex.x + 0.6 * U;
      }
      let belly = -Infinity; for (let i = A.idx(0.2); i < A.n; i++) if (A.pts[i].x > legL) belly = Math.max(belly, A.pts[i].y);
      belly = Math.min(belly + 0.7 * U, A.box.bottom - 2.2 * U);
      pen.curve([{ x: legL, y: belly - 0.3 * U }, { x: (legL + legR) / 2, y: belly + 0.25 * U }, { x: legR, y: belly - 0.3 * U }], { w: 3 });
      for (const f of [0.08, 0.26, 0.74, 0.92]) {
        const x = legL + (legR - legL) * f;
        pen.line([{ x, y: belly }, { x: x + (f < 0.5 ? -0.1 : 0.1) * U, y: Math.min(belly + 1.9 * U, A.box.bottom - 4) }], { w: 3 });
      }
      pen.curve([{ x: legL, y: belly - 0.3 * U }, { x: legL - 0.5 * U, y: belly }, { x: legL - 0.4 * U, y: belly + 0.6 * U }], { w: 2.4 });
      for (const [p, t] of humps) pen.pointer(p.x - 0.4 * U, p.y - 1.5 * U, p.x, p.y - 0.25 * U, t);
      return { target, reason };
    },
  },
  whale: {
    score: (A) => 0.8 + (A.rise < -1 ? 1.4 : 0),
    build(A, pen, lb) {
      const U = A.U, L = A.L, s = A.idx(0.3);
      const back = A.pts.slice(s).filter((_, i, a) => i % 2 === 0 || i === a.length - 1);
      pen.line(back, { w: 4 });
      const start = A.pts[s];
      let low = -Infinity; for (let i = s; i < A.n; i++) low = Math.max(low, A.pts[i].y);

    const step = (t) => { const k = Math.min(1, (t - t0) / dur); frame(prep.total * (1 - Math.pow(1 - k, 1.6))); if (k < 1) animId = requestAnimationFrame(step); };
    animId = requestAnimationFrame(step);
  }
  verdictPanel();
  buildCharButtons();
}
function verdictPanel() {
  const L = T[LANG], r = result;
  const col = r.dir > 0 ? css(`--up-${LANG}`) : r.dir < 0 ? css(`--down-${LANG}`) : css("--fg");
  const vb = $("vbig"); vb.textContent = `${r.dir > 0 ? "↗ " : r.dir < 0 ? "↘ " : "→ "}${r.dir > 0 ? L.up : r.dir < 0 ? L.down : L.flat}`; vb.style.color = col;
  const t = fmtP(r.tp, cur.cur);
  $("vmeta").textContent = `${L.names[r.pick]} · ${L.target} ${t} (${r.pct >= 0 ? "+" : ""}${r.pct.toFixed(1)}%) · ${L.conf} ${r.conf.toLocaleString("en-US")}%`;
  $("vreason").textContent = L.reason[r.reason](t);
}

/* ---------- actions ---------- */
$("b-redo").onclick = () => {
  if (forced) { const i = lastRank.indexOf(forced); forced = null; reroll = i + 1; } else reroll++;
  if (lastRank[reroll % lastRank.length] === lastPick) reroll++;
  draw(true);
};
$("b-link").onclick = async () => {
  const url = location.href.split("#")[0] + "#" + cur.id;
  try { await navigator.clipboard.writeText(url); toast(T[LANG].copied); } catch (e) { toast(T[LANG].copyFail); }
};
$("b-save").onclick = () => {
  const L = T[LANG], r = result, dpr = layout.dpr, W = cv.width, pad = 22 * dpr, headH = 74 * dpr, footH = 96 * dpr;
  const out = document.createElement("canvas"); out.width = W + pad * 2; out.height = cv.height + headH + footH;
  const c = out.getContext("2d");
  c.fillStyle = css("--panel"); c.fillRect(0, 0, out.width, out.height);
  c.fillStyle = css("--fg"); c.font = `700 ${22 * dpr}px ${css("--font-ui")}`; c.textBaseline = "top";
  c.fillText(`${name(cur)}  ${cur.sym}`, pad, pad);
  c.fillStyle = css("--muted"); c.font = `500 ${13 * dpr}px ${css("--font-num")}`;
  c.fillText(`${fmtP(cur.d.at(-1)[4], cur.cur)} · ${fmtDate(cur.d.at(-1)[0])} · ${L.periods[period]}`, pad, pad + 30 * dpr);
  c.drawImage(cv, pad, headH);
  const y0 = headH + cv.height + 10 * dpr;
  c.fillStyle = r.dir > 0 ? css(`--up-${LANG}`) : r.dir < 0 ? css(`--down-${LANG}`) : css("--fg");
  c.font = `700 ${30 * dpr}px ${css("--font-doodle")}`;
  c.fillText($("vbig").textContent, pad, y0);
  c.fillStyle = css("--fg"); c.font = `${17 * dpr}px ${css("--font-doodle")}`;
  c.fillText($("vmeta").textContent, pad, y0 + 38 * dpr);
  c.fillStyle = css("--muted"); c.font = `500 ${12 * dpr}px ${css("--font-ui")}`;
  c.fillText(`${L.title} · ${location.host || "chart-doodle"} · ${L.disc1}`, pad, y0 + 64 * dpr);
  out.toBlob((b) => {
    if (!b) return;
    const a = document.createElement("a"); a.href = URL.createObjectURL(b);
    a.download = `chart-doodle-${cur.sym.replace("/", "-")}-${r.pick}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast(L.saved);
  }, "image/png");
};
$("lang-ko").onclick = () => { LANG = "ko"; try { localStorage.setItem("cdo-lang", LANG); } catch (e) {} applyLang(); };
$("lang-en").onclick = () => { LANG = "en"; try { localStorage.setItem("cdo-lang", LANG); } catch (e) {} applyLang(); };
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => draw(false), 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (cur) { header(); draw(false); } });
function directItem(id) {
  const m = id.match(/^(kr|us)-([0-9]{6}|[A-Z]{1,5})$/); if (!m || !LIVE_API) return null;
  return { id, sym: m[2], ko: m[2], en: m[2], cat: m[1], cur: m[1] === "kr" ? "KRW" : "USD", d: null };
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); const it = BYID[h] || directItem(h); if (it && it !== cur) select(it); });

/* ---------- boot ---------- */
applyLang();
Promise.all([
  fetch("data.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
  document.fonts ? Promise.race([Promise.all([document.fonts.load("700 20px Gaegu"), document.fonts.load("20px Gaegu"), document.fonts.load("500 12px 'IBM Plex Mono'")]), new Promise((r) => setTimeout(r, 2500))]) : null,
]).then(([data]) => {
  ITEMS = data.items; ASOF = data.asof; for (const it of ITEMS) BYID[it.id] = it;
  $("loading").hidden = true; $("main").hidden = false;
  applyLang();
  const h = location.hash.slice(1), fromHash = BYID[h];
  cur = fromHash || BYID[LANG === "ko" ? "kr-005930" : "c-BTC"] || ITEMS[0];
  header(); draw(true);
  refreshLive(cur);
  if (!fromHash && directItem(h)) select(directItem(h));
}).catch(() => { $("loading").textContent = T[LANG].loadErr; });
})();
</script>
</body>
