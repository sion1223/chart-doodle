name: Refresh chart data

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 16:40 KST, after the Korean close
    - cron: "40 21 * * 1-5"  # 06:40 KST, after the US close
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python fetch_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet data.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh chart data"
          git push
